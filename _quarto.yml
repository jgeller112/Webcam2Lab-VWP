project:
  title: "Web 2 Lab - Stage 1 RR"
  render:
    - /manuscript/web2lab-RR_stage1.qmd

site-url: "https://jgeller112.github.io/Webcam2Lab-VWP/"

csl: apa.csl

format:
  preprint-typst:
    wordcount: true
    line-number: true
  html: 
    theme: cosmo
    toc: true
    mainfont: Fira Sans
    toc-depth: 2
    toc-title: "Manuscript Outline"
    toc-location: right
    code-tools: true
    code-fold: true
    code-summary: "Show R code"
    comments:
      hypothesis: true
    execute:
      echo: true

  preprint-docx:
    output-file: web2lab-RR_stage1.docx
